<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Visualizar Post</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f3f4f6;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .post {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      max-width: 400px;
      width: 100%;
      text-align: center;
    }
    img {
      width: 100%;
      border-radius: 10px;
      margin-bottom: 15px;
    }
    h2 {
      color: #333;
      margin-bottom: 10px;
    }
    p {
      color: #555;
    }
  </style>
</head>
<body>
<h1>Post</h1>
<div class="post">
  <img id="image" src="" alt="Imagem do post">
  <div id="description"></div>
</div>

  <script>
  async function loadPost() {
    // Pega o ID da URL, ex: post.html?id=6
    const params = new URLSearchParams(window.location.search);
    const postId = params.get("id");

    if (!postId) {
      document.getElementById("description").textContent = "ID do post não informado.";
      return;
    }

    try {
      // <-- Aqui é onde você coloca o fetch
      const response = await fetch(`http://localhost:3000/posts/${postId}`);
      const post = await response.json();

      document.getElementById('description').textContent = post.description;

      if (post.media) {
        // Se for URL externa, usa direto
        if (post.media.startsWith('http')) {
          document.getElementById('image').src = post.media;
        } else {
          // Se for upload local
          document.getElementById('image').src = `http://localhost:3000/${post.media.replace(/\\/g,'/')}`;
        }
      } else {
        document.getElementById('image').alt = 'Sem imagem';
      }

    } catch (err) {
      console.error(err);
      document.getElementById("description").textContent = "Erro ao carregar o post.";
    }
  }

  loadPost();
</script>
</body>
</html>
